<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arun Kumar - Modern Two-Column Resume</title>
    <style>
        /* Modern Two-Column Styles */
        body {
            font-family: 'Roboto', 'Segoe UI', sans-serif; /* Highly readable, modern sans-serif */
            margin: 40px;
            line-height: 1.6;
            color: #333;
            max-width: 1000px; /* Slightly wider layout */
            margin-left: auto;
            margin-right: auto;
        }

        :root {
            --primary-color: #d9534f; /* Modern Brick Red */
            --accent-bg: #f5f5f5;
        }

        /* Main Layout Grid */
        .resume-container {
            display: grid;
            grid-template-columns: 30% 70%; /* 30% for skills, 70% for experience */
            gap: 20px;
            margin-top: 20px;
        }
        .left-column {
            padding-right: 15px;
            /* Sticky section on the side */
        }
        .right-column {
            border-left: 1px solid #ddd;
            padding-left: 20px;
        }

        /* Typography */
        h1, h2, h3 {
            color: #222;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 32px;
            text-align: center;
            margin-bottom: 0;
            font-weight: 500;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 5px;
        }
        h2 {
            font-size: 18px;
            text-transform: uppercase;
            color: var(--primary-color);
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        h3 {
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
        }
        p, li {
            font-size: 14px;
            margin: 4px 0;
        }
        ul {
            padding-left: 20px;
            margin: 8px 0;
        }
        .contact-info {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .contact-info a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 5px;
        }

        /* Skills in Left Column */
        #skills {
            padding: 10px;
            background-color: var(--accent-bg);
            border-radius: 5px;
        }
        #skills ul {
            list-style: none;
            padding-left: 0;
        }
        #skills strong {
            display: block;
            margin-top: 10px;
            color: #000;
            font-weight: 700;
        }
        #skills li {
            font-size: 13px;
        }
        
        /* Experience in Right Column */
        .job {
            margin-bottom: 20px;
        }
        .job-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .job-title {
            color: var(--primary-color);
        }
        .job-details {
            font-weight: normal;
            font-size: 13px;
            color: #666;
            font-style: italic;
        }
        
        /* Education - Kept Clean */
        #education table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        #education th, #education td {
            border: none;
            border-bottom: 1px dashed #ddd;
            padding: 5px 0;
            text-align: left;
        }
        #education th {
            color: #000;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div id="loading">Loading resume...</div>
    <div id="error" style="display: none;"></div>

    <header id="header"></header>
    <section id="summary"></section>
    
    <div class="resume-container">
        <div class="left-column">
            <section id="skills"></section>
            <section id="education"></section>
        </div>
        <div class="right-column">
            <section id="experience"></section>
            <section id="personal" style="display: none;"></section>
        </div>
    </div>

    <script>
        // (The JavaScript structure is slightly modified to handle the two-column layout)
        async function loadResume() {
            try {
                const response = await fetch('resume.json');
                if (!response.ok) throw new Error('Failed to load resume data');
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';

                // Header
                const header = document.getElementById('header');
                header.innerHTML = `
                    <h1>${data.name}</h1>
                    <div class="contact-info">
                        <span>${data.contact.email}</span> | 
                        <a href="${data.contact.linkedin}">LinkedIn</a> |
                        <a href="${data.contact.github}">GitHub</a> |
                        <span>${data.contact.location}</span>
                    </div>
                `;

                // Professional Summary
                document.getElementById('summary').innerHTML = `
                    <p>${data.summary}</p>
                `;

                // Skills (Now in left column)
                const skillsSection = document.getElementById('skills');
                let skillsHTML = '<h2>Skills</h2><ul>';
                data.skills.forEach(skill => {
                    skillsHTML += `<li><strong>${skill.category}</strong>: ${skill.items.join(', ')}</li>`;
                });
                skillsHTML += '</ul>';
                skillsSection.innerHTML = skillsHTML;
                
                // Education (Now in left column)
                const educationSection = document.getElementById('education');
                let educationHTML = `
                    <h2>Education</h2>
                    <table>
                        <tr>
                            <th>Qualification</th>
                            <th>Institution</th>
                            <th>Year</th>
                        </tr>
                        ${data.education.map(edu => `
                            <tr>
                                <td>${edu.qualification}</td>
                                <td>${edu.institution}</td>
                                <td>${edu.year}</td>
                            </tr>
                        `).join('')}
                    </table>
                `;
                educationSection.innerHTML = educationHTML;


                // Professional Experience (Now in right column)
                const experienceSection = document.getElementById('experience');
                let experienceHTML = '<h2>Professional Experience</h2>';
                data.experience.forEach(job => {
                    experienceHTML += `
                        <div class="job">
                            <div class="job-header">
                                <span class="job-title">${job.title} at ${job.company}</span>
                                <span>${job.period}</span>
                            </div>
                            <div class="job-details">${job.location}</div>
                            <ul>
                                ${job.responsibilities.map(resp => `<li>${resp}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                });
                experienceSection.innerHTML = experienceHTML;

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading resume: ' + error.message;
            }
        }

        window.onload = loadResume;
    </script>
</body>
</html>
